# The bench station on breadboards (docs/hardware/bench-station-wiring.md, step 1).
# The one source of the breadboard map: tools in this directory read it, check it against the
# wiring guide and the firmware, plan the jumpers, and draw the boards.
#
# A breakout's `body` is its board outline [dx, dy, w, d] in mm: the centre's offset from the centre
# of its pins (+dy down the rows), its width along the columns and its depth along the rows. Each
# breakout's header sits on row a and its board overhangs outward, over the rails and off the edge:
# no jumper or part may use a hole under a body. Sizes from the parts' design files.
#
# Holes: board A (signals) or B (power); row a-e, f-j, or a rail: L+ L- (beside row a), R- R+
# (beside row j); column 1-63. A part's pins sit on one row, from `origin` along `step`
# (+1: increasing column). Pin orders come from each part's `source`; "bench check" means no
# manufacturer page shows the order, and the build sheet asks for a check; "passive" means a
# two-lead part that goes either way round.
#
# Mode A (daily, the board on USB) is drawn: the BATTERY POWER shunt is open and the 100 ohm test
# load is fitted (wiring guide section 5).

version = 1
split_rails = false   # some 830-point boards break each rail at the centre: set true for those

# The NUCLEO pins this map uses (UM2592; the guide's section 6 checklist still applies).
# CN6.4 and CN7.16 are the same 3V3 net on the board; CN6.6 and CN6.7 are both GND.
[nucleo]
ties = [["CN6.4", "CN7.16"], ["CN6.6", "CN6.7"]]

# ---- board A: signals ----

[[part]]
id = "BOBW"
kind = "SparkFun BOB-14021 RJ11 breakout (wind cable)"
board = "A"
origin = ["a", 3]
step = 1
body = [0.0, -9.0, 21.6, 20.6]
pins = ["1", "2", "3", "4", "5", "6"]
labels = ["-", "B", "R", "G", "Y", "-"]
source = "https://github.com/sparkfun/RJ11_Breakout"
note = "Inner conductors 3, 4: the cups. Outer 2, 5: the vane (SEN-15901). Check each with a meter"

[[part]]
id = "BOBR"
kind = "SparkFun BOB-14021 RJ11 breakout (rain cable)"
board = "A"
origin = ["a", 12]
step = 1
body = [0.0, -9.0, 21.6, 20.6]
pins = ["1", "2", "3", "4", "5", "6"]
labels = ["-", "B", "R", "G", "Y", "-"]
source = "https://github.com/sparkfun/RJ11_Breakout"
note = "Inner conductors 3, 4: the bucket switch (SEN-15901). Check with a meter"

[[part]]
id = "QT"
kind = "STEMMA QT to male header cable (to the 5-port hub)"
board = "A"
origin = ["a", 40]
step = 1
pins = ["GND", "V+", "SDA", "SCL"]
labels = ["black", "red", "blue", "yellow"]
source = "https://learn.adafruit.com/introducing-adafruit-stemma-qt/technical-specs"

[[part]]
id = "R1"
kind = "10 kOhm resistor, cups pull-up"
board = "A"
origin = ["g", 4]
step = 4
pins = ["1", "2"]
source = "passive"   # a two-lead part: either way round

[[part]]
id = "C1"
kind = "100 nF capacitor, cups filter"
board = "A"
origin = ["g", 11]
step = 1
pins = ["1", "2"]
source = "passive"

[[part]]
id = "R2"
kind = "10 kOhm resistor, rain pull-up"
board = "A"
origin = ["g", 15]
step = 4
pins = ["1", "2"]
source = "passive"

[[part]]
id = "C2"
kind = "100 nF capacitor, rain filter"
board = "A"
origin = ["g", 22]
step = 1
pins = ["1", "2"]
source = "passive"

[[part]]
id = "R3"
kind = "10 kOhm resistor, vane pull-up"
board = "A"
origin = ["g", 26]
step = 4
pins = ["1", "2"]
source = "passive"

# ---- board B: power ----

[[part]]
id = "CHGR"
kind = "Adafruit bq24074 charger #4755 (11-pin header)"
board = "B"
origin = ["a", 50]
step = 1
body = [0.0, -13.97, 38.1, 33.02]   # from the maker's model: 2.54 mm past the header toward row b
pins = ["GND", "LIPO", "GND2", "OUT", "CHG", "PGOOD", "CE", "ISET", "THERM", "GND3", "VBUS"]
source = "https://github.com/adafruit/Adafruit-BQ24074-PCB"
note = "Labels upright, board over the rails: VBUS at column 60, GND at 50. CHG and PGOOD are open drain, active low. CE, ISET and THERM stay unconnected (board defaults)"

# The INA228 and the gauge read their labels left to right as the columns fall (step -1): with the
# board upright and over the rails, the first label sits on the higher column.
[[part]]
id = "INA"
kind = "Adafruit INA228 #5832 (8-pin header; I2C on its STEMMA QT cable)"
board = "B"
origin = ["a", 43]
step = -1
body = [0.0, -7.62, 25.4, 20.32]   # from the maker's model: 2.54 mm past the header toward row b
pins = ["VCC", "GND", "SCL", "SDA", "VBUS", "VIN-", "VIN+", "ALERT"]
source = "https://github.com/adafruit/Adafruit-INA228-PCB"
note = "Labels upright: VIN (VCC) at column 43, ALRT at 36. The shunt is between VIN+ and VIN-. Check the VBUS jumper on the back"

# The gauge's header carries no battery pin: VIN, SCL and SDA come on its STEMMA QT cable, and the
# cell reaches it through one of its two JST PH sockets (GBAT). The header only holds it in place.
[[part]]
id = "GAUGE"
kind = "Adafruit MAX17048 #5580 (6-pin header, held in place only; I2C on its STEMMA QT cable)"
board = "B"
origin = ["a", 30]
step = -1
body = [0.0, -7.62, 25.4, 20.32]   # from the maker's model: 2.54 mm past the header toward row b
pins = ["VIN", "GND", "SCL", "SDA", "INT", "QSTART"]
source = "https://learn.adafruit.com/adafruit-max17048-lipoly-liion-fuel-gauge-and-battery-monitor/pinouts"
note = "Labels upright: VIN at column 30, QStart at 25. No wire goes to the header. The battery goes in through a JST PH socket (GBAT); leave the other socket empty"

[[part]]
id = "GBAT"
kind = "JST PH 2-pin pigtail into one of the gauge's battery sockets"
board = "B"
origin = ["f", 31]
step = 1
pins = ["+", "-"]
source = "bench check"
note = "Pigtail colours vary: check + and - against the marks beside the gauge's socket"

[[part]]
id = "REG"
kind = "Pololu S7V8F3 3.3 V regulator #2122"
board = "B"
origin = ["a", 14]
step = 1
body = [0.0, -6.985, 11.43, 16.51]   # from the maker's model: 1.27 mm past the header
pins = ["SHDN", "VIN", "GND", "VOUT"]
source = "bench check"
note = "Back labels, top to bottom: VOUT, GND (square pad), VIN, SHDN. Front up, over the rails: VOUT at column 17, SHDN at 14"

[[part]]
id = "SHUNT"
kind = "2-pin header with shunt: BATTERY POWER, USB UNPLUGGED (open in mode A)"
board = "B"
origin = ["a", 8]
step = 1
pins = ["1", "2"]
source = "passive"

[[part]]
id = "CELL"
kind = "Battery 6600 mAh #353 on a JST PH pigtail"
board = "B"
origin = ["f", 39]
step = 1
pins = ["+", "-"]
source = "bench check"
note = "JST PH pigtail colours vary: check + and - with a meter before plugging in"

[[part]]
id = "RLOAD"
kind = "100 Ohm 1/2 W test load (mode A only)"
board = "B"
origin = ["f", 49]
step = 4
pins = ["1", "2"]
source = "passive"

# ---- board C: display ----

# The 20-pin header reads pin 20 at the left and pin 1 at the right with the screen facing you, so pin 1
# takes the lowest column (step +1). The board hangs outward over the rails like the breakouts; its
# outline is Adafruit's 85 x 58 mm with the header 2.8 mm from the near edge and 1.35 mm toward pin 1
# from the middle (measured from a photo of the bench module, to about 1 mm).
[[part]]
id = "OLED"
kind = "Adafruit 2.7in 128x64 OLED #2674 (SSD1325, SPI mode: R19 and R21 fitted)"
board = "C"
origin = ["a", 22]
step = 1
body = [-1.35, -26.0, 85.0, 58.0]
pins = ["GND", "VCC", "NC3", "DC", "WR", "RD", "SCLK", "DIN", "D2", "D3", "D4", "D5", "D6", "D7", "CS", "RST",
        "NC17", "NC18", "NC19", "FG"]
source = "https://learn.adafruit.com/2-7-monochrome-128x64-oled-display-module/pinouts"
note = "SPI mode needs R19 and R21 fitted and R18 and R20 empty on the back. Pin 1 (GND) at column 22, pin 20 (frame ground) at 41. Only GND, VCC, DC, SCLK, DIN, CS and RST are wired; FG may stay open"

# The kit's 220 uF capacitor, in the strips of the OLED's GND (column 22) and 3.3 V (column 23).
[[part]]
id = "COLED"
kind = "220 uF electrolytic capacitor, OLED supply"
board = "C"
origin = ["e", 23]
step = -1
pins = ["+", "-"]
source = "bench check"
note = "Polarised: + (the longer lead) in column 23 with the OLED's 3.3 V, the striped - lead in column 22 with its GND"

# ---- required jumpers ----
# The guide feeds the regulator output, through the BATTERY POWER shunt, to the NUCLEO's 3V3 pin
# CN7.16 (section 5). Left to the planner, this net could take a shorter path through board A.

[[link]]
a = "SHUNT.2"
b = "N:CN7.16"

# The hub's power and ground come straight from the NUCLEO (section 2: CN6.4, CN6.6), so the
# sensors' ground does not return through the power board's load path.
[[link]]
a = "QT.V+"
b = "N:CN6.4"

[[link]]
a = "QT.GND"
b = "N:CN6.6"

# ---- nets ----
# `members` are PART.PIN, or N:<header>.<pin> for a NUCLEO pin. `rails` carry the net on a board.
# `mcu` names the STM32WL pin (or 3V3, GND) of a net that reaches the NUCLEO: it is checked against
# the wiring guide's section 2 table and against the firmware's pin constants.

[[net]]
name = "3V3"
mcu = "3V3"
class = "power"
members = ["N:CN6.4", "N:CN7.16", "QT.V+", "R1.2", "R2.2", "R3.2", "SHUNT.2", "OLED.VCC", "COLED.+"]
rails = ["A:L+"]

[[net]]
name = "GND"
mcu = "GND"
class = "ground"
members = ["N:CN6.6", "N:CN6.7", "QT.GND", "BOBW.2", "BOBW.3", "BOBR.3", "C1.2", "C2.2",
           "CHGR.GND", "INA.GND", "GBAT.-", "REG.GND", "CELL.-", "RLOAD.2", "OLED.GND", "COLED.-"]
rails = ["A:L-", "B:L-"]

[[net]]
name = "I2C_SDA"
mcu = "PA11"
class = "i2c"
members = ["N:CN5.9", "QT.SDA"]

[[net]]
name = "I2C_SCL"
mcu = "PA12"
class = "i2c"
members = ["N:CN5.10", "QT.SCL"]

[[net]]
name = "CUPS"
mcu = "PC0"
class = "wind"
members = ["N:CN10.14", "BOBW.4", "R1.1", "C1.1"]

[[net]]
name = "VANE"
mcu = "PB2"
class = "wind"
members = ["N:CN7.30", "BOBW.5", "R3.1"]

[[net]]
name = "RAIN"
mcu = "PB5"
class = "rain"
members = ["N:CN10.29", "BOBR.4", "R2.1", "C2.1"]

[[net]]
name = "PGOOD"
mcu = "PB8"
class = "charger"
members = ["N:CN10.27", "CHGR.PGOOD"]

[[net]]
name = "CHG"
mcu = "PB10"
class = "charger"
members = ["N:CN10.25", "CHGR.CHG"]

[[net]]
name = "CELL_POS"
class = "power"
members = ["CELL.+", "INA.VIN+"]

[[net]]
name = "BATT"
class = "power"
members = ["INA.VIN-", "CHGR.LIPO", "GBAT.+"]

[[net]]
name = "SYS_OUT"
class = "power"
members = ["CHGR.OUT", "REG.VIN", "RLOAD.1"]

[[net]]
name = "REG_OUT"
class = "power"
members = ["REG.VOUT", "SHUNT.1"]

# The OLED on SPI1 (firmware/i2cscan/App/oled.h). Morpho CN10 odd pins, UM2592 Rev 4 Table 18.
[[net]]
name = "OLED_SCLK"
mcu = "PA5"
class = "display"
members = ["N:CN10.11", "OLED.SCLK"]

[[net]]
name = "OLED_DIN"
mcu = "PA7"
class = "display"
members = ["N:CN10.15", "OLED.DIN"]

[[net]]
name = "OLED_CS"
mcu = "PA4"
class = "display"
members = ["N:CN10.17", "OLED.CS"]

[[net]]
name = "OLED_DC"
mcu = "PC2"
class = "display"
members = ["N:CN10.21", "OLED.DC"]

[[net]]
name = "OLED_RST"
mcu = "PC1"
class = "display"
members = ["N:CN10.23", "OLED.RST"]
