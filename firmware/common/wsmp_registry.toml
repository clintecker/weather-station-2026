# ---- module types (section 4.4): channels are [quantity, kind] pairs, in channel order ----
[[module_type]]
code = 1
name = "air temperature and humidity"
id = "AIR_TH"
part = "SHT45"
schema = 1
report_class = "minute"
role = "outside air"
channels = [[1, 2], [2, 2]]

[[module_type]]
code = 2
name = "air pressure"
id = "PRESSURE"
part = "BMP581"
schema = 1
report_class = "minute"
role = "enclosure"
channels = [[3, 2]]

[[module_type]]
code = 3
name = "UVA"
id = "UVA"
part = "LTR390"
schema = 1
report_class = "minute"
role = "outside"
channels = [[8, 2]]

[[module_type]]
code = 4
name = "enclosure temperature and humidity"
id = "ENCL_TH"
part = "SHTC3"
schema = 1
report_class = "minute"
role = "enclosure"
channels = [[1, 2], [2, 2]]

[[module_type]]
code = 5
name = "battery and charger"
id = "POWER"
part = "INA228, MAX17048, bq24074"
schema = 1
report_class = "health"
role = "battery"
channels = [[9, 2], [11, 6], [12, 6], [13, 6], [14, 6], [15, 1], [16, 10]]
states = ["off", "charging", "done", "fault"]

[[module_type]]
code = 6
name = "wind"
id = "WIND"
part = "SparkFun SEN-15901"
schema = 1
report_class = "minute"
role = "outside"
channels = [[17, 6], [5, 7], [6, 8], [6, 9]]
factors = { ums_per_hz = 666980, gust_ms = 3000 }

[[module_type]]
code = 7
name = "rain"
id = "RAIN"
part = "SparkFun SEN-15901"
schema = 1
report_class = "minute"
role = "outside"
channels = [[7, 6]]
factors = { nm_per_tip = 279400 }   # 0.2794 mm

# ---- calibration of module record major 1 (docs/superpowers/specs/2026-10-21-sensor-module-ports-design.md
# section 6.9), frozen: a later record minor may only widen a bound, never tighten it. A quantity not
# listed takes no record calibration (an entry for it is CAL_REJECTED). Integers at the channel's
# scale: offset_bound is +-, gains in ppm, margins below and above the quantity's physical range
# (section 4.1, converted to the scale by the generator). ----
[[calibration]]
quantity = 1        # air temperature, 0.01 degC: +-2 degC, gain 0.98-1.02
scale = -2
offset_bound = 200
gain = [980000, 1020000]
margin = [0, 0]

[[calibration]]
quantity = 2        # relative humidity, 0.01 %: +-10 %RH, gain 0.90-1.10, 3 % crop margin each side
scale = -2
offset_bound = 1000
gain = [900000, 1100000]
margin = [300, 300]

[[calibration]]
quantity = 3        # station air pressure, 0.1 hPa: +-5 hPa, gain 0.99-1.01
scale = -1
offset_bound = 50
gain = [990000, 1010000]
margin = [0, 0]

[[calibration]]
quantity = 8        # UVA counts: +-16 counts (dark count), gain 0.1-10 (a window in front)
scale = 0
offset_bound = 16
gain = [100000, 10000000]
margin = [16, 0]
